<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kawthar Alshehri</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      font-family: system-ui, sans-serif;
      color: #fff;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    }

    .desktop {
      display: grid;
      grid-template-columns: repeat(auto-fill, 96px);
      gap: 16px;
      padding: 24px;
    }

    .icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 8px;
      border: none;
      border-radius: 8px;
      background: none;
      color: #fff;
      font: inherit;
      cursor: pointer;
    }

    .icon:hover, .icon:focus {
      background: rgba(255, 255, 255, 0.15);
      outline: none;
    }

    .icon-img { font-size: 40px; }
    .icon-label { font-size: 13px; text-align: center; }

    .taskbar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 44px;
      padding: 0 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      background: rgba(0, 0, 0, 0.6);
    }
  </style>
</head>
<body>
  <main class="desktop">
    <button class="icon" data-window="about">
      <span class="icon-img">📄</span>
      <span class="icon-label">about.txt</span>
    </button>
    <button class="icon" data-window="log">
      <span class="icon-img">📝</span>
      <span class="icon-label">learning_log.md</span>
    </button>
    <button class="icon" data-window="projects">
      <span class="icon-img">📁</span>
      <span class="icon-label">projects/</span>
    </button>
    <button class="icon" data-window="notes">
      <span class="icon-img">📁</span>
      <span class="icon-label">notes/</span>
    </button>
  </main>

  <template id="about">
    <p>I studied medicine for four years before switching to Computer Science. Now I'm working toward becoming a data analyst, learning SQL, Excel, and Power BI, and documenting my progress here.</p>
  </template>
  <template id="log"><p>Finished 12 lessons of SQLBolt.</p></template>
  <template id="projects"><p>Coming soon.</p></template>
  <template id="notes"><p>Coming soon.</p></template>

  <footer class="taskbar">
    <span>Kawthar Alshehri</span>
    <span id="clock"></span>
  </footer>

  <script>
    function tick() {
      document.getElementById("clock").textContent =
        new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
