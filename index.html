<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kawthar Alshehri</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      font-family: system-ui, sans-serif;
      color: #fff;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    }

    .desktop {
      display: grid;
      grid-template-columns: repeat(auto-fill, 96px);
      gap: 16px;
      padding: 24px;
    }

    .icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 8px;
      border: none;
      border-radius: 8px;
      background: none;
      color: #fff;
      font: inherit;
      cursor: pointer;
    }

    .icon:hover, .icon:focus {
      background: rgba(255, 255, 255, 0.15);
      outline: none;
    }

    .icon-img { font-size: 40px; }
    .icon-label { font-size: 13px; text-align: center; }

    #horse {
      position: fixed;
      bottom: 56px;
      left: 0;
      margin: 0;
      font-family: monospace;
      font-size: 14px;
      line-height: 1.1;
      color: #7cfc9a;
      opacity: 0.8;
      white-space: pre;
      pointer-events: none;
      z-index: 1;
    }

    .taskbar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 44px;
      padding: 0 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      background: rgba(0, 0, 0, 0.6);
      z-index: 2;
    }

    .window {
      position: absolute;
      width: 420px;
      max-width: calc(100vw - 32px);
      background: #f5f5f5;
      color: #222;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      overflow: hidden;
    }

    .titlebar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: #e0e0e0;
      font-size: 14px;
      cursor: move;
      user-select: none;
    }

    .close {
      border: none;
      background: none;
      font-size: 16px;
      cursor: pointer;
    }

    .close:hover { color: #c00; }

    .content { padding: 16px; line-height: 1.6; }

    @media (max-width: 700px) {
      .window {
        top: 0 !important;
        left: 0 !important;
        width: 100vw;
        max-width: 100vw;
        height: calc(100vh - 44px);
        border-radius: 0;
      }
      .titlebar { cursor: default; }
    }
  </style>
</head>
<body>
  <main class="desktop">
    <button class="icon" data-window="about">
      <span class="icon-img">📄</span>
      <span class="icon-label">about.txt</span>
    </button>
    <button class="icon" data-window="log">
      <span class="icon-img">📝</span>
      <span class="icon-label">learning_log.md</span>
    </button>
    <button class="icon" data-window="projects">
      <span class="icon-img">📁</span>
      <span class="icon-label">projects/</span>
    </button>
    <button class="icon" data-window="notes">
      <span class="icon-img">📁</span>
      <span class="icon-label">notes/</span>
    </button>
  </main>

  <pre id="horse" aria-hidden="true"></pre>

  <template id="about">
    <p>I studied medicine for four years before switching to Computer Science. Now I'm working toward becoming a data analyst, learning SQL, Excel, and Power BI, and documenting my progress here.</p>
  </template>
  <template id="log"><p>Finished 12 lessons of SQLBolt.</p></template>
  <template id="projects"><p>Coming soon.</p></template>
  <template id="notes"><p>Coming soon.</p></template>

  <footer class="taskbar">
    <span>Kawthar Alshehri</span>
    <span id="clock"></span>
  </footer>

  <script>
    function tick() {
      document.getElementById("clock").textContent =
        new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }
    tick();
    setInterval(tick, 1000);

    const horseBody = String.raw`               __
              / o\__
   _________/    __/
 ~/          \__/
~ \__________/`;

    const horseLegs = [
      String.raw`   /  /    \  \ 
  /  /      \  \ `,
      String.raw`   |  |    |  |
   |  |    |  |`,
      String.raw`   \  \    /  /
    \  \  /  /`
    ];

    const horse = document.getElementById("horse");
    const legOrder = [0, 1, 2, 1];
    let step = 0;
    let x = -200;

    setInterval(function () {
      horse.textContent = horseBody + "\n" + horseLegs[legOrder[step % 4]];
      step++;
      x += 10;
      if (x > window.innerWidth) x = -200;
      horse.style.transform = "translateX(" + x + "px)";
    }, 90);

    let z = 10;
    document.querySelectorAll(".icon").forEach(function (icon) {
      icon.addEventListener("click", function () {
        openWindow(icon.dataset.window, icon.querySelector(".icon-label").textContent);
      });
    });

    function openWindow(id, title) {
      const existing = document.getElementById("win-" + id);
      if (existing) { existing.style.zIndex = ++z; return; }

      const win = document.createElement("div");
      win.className = "window";
      win.id = "win-" + id;
      win.style.zIndex = ++z;

      const offset = document.querySelectorAll(".window").length * 30;
      win.style.top = (80 + offset) + "px";
      win.style.left = (140 + offset) + "px";

      win.innerHTML =
        '<div class="titlebar"><span>' + title + '</span>' +
        '<button class="close" aria-label="Close">✕</button></div>' +
        '<div class="content"></div>';

      win.querySelector(".content").appendChild(document.getElementById(id).content.cloneNode(true));
      win.querySelector(".close").addEventListener("click", function () { win.remove(); });
      win.addEventListener("pointerdown", function () { win.style.zIndex = ++z; });

      makeDraggable(win, win.querySelector(".titlebar"));
      document.body.appendChild(win);
    }

    function makeDraggable(win, handle) {
      handle.addEventListener("pointerdown", function (e) {
        if (e.target.closest(".close") || window.innerWidth < 700) return;
        const dx = e.clientX - win.offsetLeft;
        const dy = e.clientY - win.offsetTop;

        function move(ev) {
          win.style.left = (ev.clientX - dx) + "px";
          win.style.top = (ev.clientY - dy) + "px";
        }
        function up() {
          document.removeEventListener("pointermove", move);
          document.removeEventListener("pointerup", up);
        }
        document.addEventListener("pointermove", move);
        document.addEventListener("pointerup", up);
      });
    }
  </script>
</body>
</html>
